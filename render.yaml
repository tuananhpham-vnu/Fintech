# Render Blueprint — AI service nội bộ (Contracts 1.0.2). Hướng dẫn: services/ai/docs/deploy-render.md
# Contract yêu cầu service chỉ ở loopback/private network. Gói free không có Private Service nên tạm dùng
# Web Service + X-Internal-Key bắt buộc (fail-closed, không có trang docs). Khi apps/api cũng lên Render:
# đổi `type: web` -> `type: pserv` (gói trả phí) để chỉ gọi được trong mạng nội bộ Render.
services:
  - type: web
    name: fintech-ai-internal
    runtime: python
    plan: free
    region: singapore
    branch: main
    rootDir: .
    buildCommand: pip install -e ./services/ai
    startCommand: cd services/ai && python -m runner serve --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - services/ai/**
        - packages/contracts/**
        - render.yaml
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: AI_MODE
        value: live                 # inspect/extract dùng provider live; không fallback sang mock
      - key: MODEL_ID
        value: gemini-3.1-flash-lite
      - key: PROMPT_VERSION
        value: payment-condition-v1
      - key: CONTRACTS_DIR
        value: /opt/render/project/src/packages/contracts
      - key: ENABLE_TEST_CONSOLE
        value: "0"                  # console nội bộ tắt trong cấu hình triển khai
      - key: INTERNAL_API_KEY
        generateValue: true         # Render tự sinh; Đức copy sang env của apps/api
      - key: GEMINI_API_KEY
        sync: false                 # nhập tay trên Dashboard, không commit
