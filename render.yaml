# Render Blueprint — AIC hackathon demo, deployed from branch `deploy`. Guide: deploy/README.md
# Two services. No secrets in this file: `sync: false` values are entered in the Render Dashboard.
#   aic-backend (Starter, Docker): NestJS API on $PORT + document/dossier/intake workers + Python AI service.
#                The AI service listens on 127.0.0.1 only and shares the private cache with the API.
#   aic-web     (Free, Docker):    Next.js UI; proxies /api/v2/* server-side to aic-backend.
# Database: Supabase PostgreSQL (session pooler URL). Migrations run in preDeployCommand before each deploy.
services:
  - type: web
    name: aic-backend
    runtime: docker
    plan: starter
    region: singapore
    branch: deploy
    dockerfilePath: ./deploy/backend/Dockerfile
    dockerContext: .
    preDeployCommand: node deploy/backend/predeploy.cjs   # migrations + runtime-role privileges, as owner
    healthCheckPath: /api/v2/health/ready
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - apps/api/**
        - services/ai/**
        - packages/contracts/**
        - docs/implementation/policies/**
        - deploy/backend/**
        - pnpm-lock.yaml
        - render.yaml
    envVars:
      # --- entered by you in the Dashboard (never commit) ---
      - key: DATABASE_URL
        sync: false               # Supabase session pooler URL for role aic_runtime (restricted), see deploy/README.md
      - key: AIC_MIGRATION_DATABASE_URL
        sync: false               # Supabase session pooler URL for the owner role postgres; pre-deploy only
      - key: GEMINI_API_KEY
        sync: false
      - key: AIC_FRONTEND_ORIGIN
        sync: false               # exact public URL of aic-web, e.g. https://aic-web.onrender.com
      # --- generated by Render; used only inside this container (API <-> AI service) ---
      - key: INTERNAL_API_KEY
        generateValue: true
      # --- API ---
      - key: NODE_ENV
        value: production
      - key: AIC_RUNTIME_MODE
        value: foundation
      - key: AIC_DOCUMENT_RUNTIME
        value: production
      - key: AIC_DOCUMENT_AI_MODE
        value: live                 # never falls back to mock/gold
      - key: AIC_STORAGE_DIR
        value: /var/lib/aic/private # disposable cache; canonical PDF bytes are in PostgreSQL
      - key: AIC_IDEMPOTENCY_TTL_MS
        value: "86400000"           # required in production document mode (no default)
      # --- AI service (loopback) ---
      - key: AI_MODE
        value: live
      - key: AI_PROVIDER
        value: gemini               # explicit: otherwise some paths default to a local Ollama
      - key: GEMINI_MODEL_ID
        value: gemini-3.1-flash-lite
      - key: OCR_ENGINE
        value: provider             # scanned pages are OCR'd by Gemini; results stay "uncertain"
      - key: CONTRACTS_DIR
        value: /app/packages/contracts
      - key: AI_SPEND_LEDGER_DIR
        value: /var/lib/aic/ledger
      - key: AI_LOAD_DOTENV
        value: "0"
      - key: ENABLE_TEST_CONSOLE
        value: "0"
      - key: AI_MAX_MODEL_CALLS
        value: "2"                  # bounded concurrency/memory on a 512 MB instance
      - key: AI_MAX_MODEL_QUEUE
        value: "8"
      - key: MALLOC_ARENA_MAX
        value: "2"                  # less glibc memory fragmentation (Python + Node)

  - type: web
    name: aic-web
    runtime: docker
    plan: free                      # sleeps after 15 min idle (~1 min wake-up). Change to starter to avoid that.
    region: singapore
    branch: deploy
    dockerfilePath: ./deploy/web/Dockerfile
    dockerContext: .
    healthCheckPath: /login
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - apps/web/**
        - deploy/web/**
        - pnpm-lock.yaml
        - render.yaml
    envVars:
      - key: AIC_BACKEND_URL
        sync: false                 # https://<aic-backend URL>/api/v2
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
