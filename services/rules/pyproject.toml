[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sme-rules"
version = "1.0.0"
description = "P3 - Chuẩn hóa, đối chiếu và quy tắc R01-R10 cho MVP rà soát hồ sơ vay SME"
requires-python = ">=3.9"
dependencies = ["pydantic>=2.6,<3"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["sme_rules*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
