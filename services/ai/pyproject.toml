[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fintech-ai"
version = "0.1.0"
description = "Internal AI service (inspect/extract/evaluate) — Fintech Blueprint contracts 1.0.2"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn==0.32.1",
  "pydantic>=2.6,<3",
  "jsonschema==4.26.0",
  "rfc3339-validator==0.1.4",   # bắt buộc để FormatChecker kiểm "date-time"; thiếu thì service từ chối chạy
  "httpx==0.28.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx==0.28.1", "datamodel-code-generator==0.26.3"]

[tool.setuptools.packages.find]
include = ["runner*", "extraction*", "normalize*", "linking*", "rules*", "providers*", "evaluation*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
