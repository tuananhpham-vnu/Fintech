[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fintech-ai"
version = "0.1.0"
description = "Internal AI service (inspect/extract/evaluate) — Fintech Blueprint contracts 1.0.2"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn==0.32.1",
  "pydantic>=2.6,<3",
  "jsonschema==4.26.0",
  "rfc3339-validator==0.1.4",   # bắt buộc để FormatChecker kiểm "date-time"; thiếu thì service từ chối chạy
  "httpx==0.28.1",
  "pymupdf==1.28.2",            # M2 extraction: đọc PDF/render trang scan; wheel Windows + Linux, không cần gói hệ thống
  "openpyxl==3.1.5",
  "xlrd==2.0.2",
  "Pillow==12.3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx==0.28.1", "datamodel-code-generator==0.26.3", "xlwt==1.3.0"]

[tool.setuptools.packages.find]
include = ["runner*", "extraction*", "financial_import*", "normalize*", "linking*", "rules*", "providers*", "evaluation*"]

[tool.setuptools.package-data]
runner = ["console/*.html", "console/*.json"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
