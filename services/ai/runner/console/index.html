<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>AI Test Console</title>
<style>
:root {
  --bg: #f4f5f7; --panel: #fff; --text: #1b1f24; --muted: #5d6673; --border: #dde1e6; --accent: #2457d6;
  --accent-text: #fff; --soft: #f1f3f6; --ok: #1a7f37; --ok-bg: #e6f4ea; --warn: #8a5d00; --warn-bg: #fff4d6;
  --bad: #c62828; --bad-bg: #fdecea; --info: #2457d6; --info-bg: #e8eefc; --hl: #fff3b0;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 15px; line-height: 1.5;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1216; --panel: #171b21; --text: #e6e9ed; --muted: #9aa4b1; --border: #2a3039; --accent: #6d95ff;
    --accent-text: #0f1216; --soft: #1d2229; --ok: #56d364; --ok-bg: #12261a; --warn: #e3b341; --warn-bg: #2b2210;
    --bad: #ff7b72; --bad-bg: #2d1414; --info: #79a6ff; --info-bg: #142040; --hl: #3d3410;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1216; --panel: #171b21; --text: #e6e9ed; --muted: #9aa4b1; --border: #2a3039; --accent: #6d95ff;
  --accent-text: #0f1216; --soft: #1d2229; --ok: #56d364; --ok-bg: #12261a; --warn: #e3b341; --warn-bg: #2b2210;
  --bad: #ff7b72; --bad-bg: #2d1414; --info: #79a6ff; --info-bg: #142040; --hl: #3d3410;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--text); }
button, select, input, textarea { font: inherit; color: var(--text); }
button { border: 1px solid var(--border); background: var(--panel); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 650; padding: 10px 20px; }
button:disabled { opacity: .55; cursor: progress; }
button.link { border: 0; background: none; color: var(--accent); padding: 0; }
select, input[type=password], textarea { background: var(--soft); border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; }
textarea { width: 100%; resize: vertical; }
code, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
p { margin: 0; }

/* thanh trên cùng */
.topbar { background: var(--panel); border-bottom: 1px solid var(--border); }
.topbar .in { max-width: 1280px; margin: 0 auto; padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
.topbar h1 { font-size: 16px; margin: 0; }
.topbar .grow { flex: 1; }
.topbar label { font-size: 13px; color: var(--muted); }
#case-select { min-width: 280px; max-width: 100%; }
.key { display: flex; gap: 6px; align-items: center; }
.key input { width: 220px; }
.key.need input { border-color: var(--bad); }

.wrap { max-width: 1280px; margin: 0 auto; padding: 16px; display: grid; gap: 16px; }
.panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
.panel h2 { font-size: 15px; margin: 0 0 12px; }

/* dải test cho nhóm */
.test { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: baseline; padding: 10px 14px; border-radius: 10px;
  background: var(--info-bg); color: var(--text); font-size: 14px; }
.test .tag { font-weight: 700; color: var(--info); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
.test.pass { background: var(--ok-bg); } .test.pass .tag { color: var(--ok); }
.test.fail { background: var(--bad-bg); } .test.fail .tag { color: var(--bad); }
.test .verdict { font-weight: 700; margin-left: auto; }

/* đầu hồ sơ */
.case-head { display: flex; flex-wrap: wrap; gap: 14px 28px; align-items: center; }
.case-head .who { font-size: 20px; font-weight: 700; }
.facts { display: flex; flex-wrap: wrap; gap: 4px 28px; }
.fact span { display: block; font-size: 12px; color: var(--muted); }
.fact b { font-size: 15px; }
.case-head .grow { flex: 1; }

.cols { display: grid; grid-template-columns: 380px minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 900px) { .cols { grid-template-columns: 1fr; } .key input { width: 160px; } }

/* tài liệu */
.doc { border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px; transition: box-shadow .3s; }
.doc > summary { list-style: none; cursor: pointer; padding: 9px 12px; display: flex; gap: 10px; align-items: center; }
.doc > summary::-webkit-details-marker { display: none; }
.doc > summary::after { content: "›"; margin-left: auto; color: var(--muted); transition: transform .15s; }
.doc[open] > summary::after { transform: rotate(90deg); }
.doc .ico { width: 28px; height: 28px; border-radius: 6px; background: var(--soft); display: grid; place-items: center; font-size: 14px; flex: none; }
.doc .name { font-weight: 600; font-size: 14px; }
.doc .file { font-size: 12px; color: var(--muted); }
.doc .body { padding: 0 12px 10px; }
.doc.flash { box-shadow: 0 0 0 3px var(--accent); }
.doc.missing { border-style: dashed; border-color: var(--bad); }
.doc.missing .ico { background: var(--bad-bg); color: var(--bad); }
.fields { width: 100%; border-collapse: collapse; font-size: 13px; }
.fields td { padding: 4px 0; border-top: 1px solid var(--border); vertical-align: top; }
.fields td:first-child { color: var(--muted); width: 45%; padding-right: 8px; }
.fields tr.hl td { background: var(--hl); }
.pill { display: inline-block; padding: 1px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--soft); color: var(--muted); white-space: nowrap; }
.p-ok { background: var(--ok-bg); color: var(--ok); }
.p-warn { background: var(--warn-bg); color: var(--warn); }
.p-bad { background: var(--bad-bg); color: var(--bad); }
.p-info { background: var(--info-bg); color: var(--info); }
.req { background: var(--soft); border-radius: 8px; padding: 10px 12px; font-size: 13px; margin-top: 8px; }

/* phát hiện của AI */
.issue { border: 1px solid var(--border); border-left: 5px solid var(--border); border-radius: 8px; padding: 14px; margin-bottom: 12px; }
.issue.bad { border-left-color: var(--bad); } .issue.ok { border-left-color: var(--ok); } .issue.warn { border-left-color: var(--warn); }
.issue .top { display: flex; gap: 10px; align-items: flex-start; }
.issue .headline { font-size: 16px; font-weight: 650; flex: 1; }
.issue .sub { font-size: 13px; color: var(--muted); margin-top: 2px; }
.amounts { display: flex; gap: 24px; margin-top: 10px; font-size: 14px; }
.amounts span { color: var(--muted); font-size: 12px; display: block; }
.why { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.src { margin-top: 10px; font-size: 13px; }
.src button { font-size: 12px; padding: 2px 8px; margin: 3px 4px 0 0; }
.ask { margin-top: 12px; padding: 10px 12px; border-radius: 8px; background: var(--soft); font-size: 14px; }
.ask b { display: block; font-size: 12px; color: var(--muted); font-weight: 600; margin-bottom: 2px; }
.rules { display: flex; flex-wrap: wrap; gap: 8px; }
.rule { display: flex; gap: 6px; align-items: center; padding: 6px 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; }
.empty { color: var(--muted); text-align: center; padding: 40px 10px; }
.spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid var(--border); border-top-color: var(--accent);
  border-radius: 50%; animation: spin 1s linear infinite; vertical-align: -3px; margin-right: 8px; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spinner { animation: none; } .doc { transition: none; } }
details.tech > summary { cursor: pointer; color: var(--muted); font-size: 13px; }
pre { background: var(--soft); border: 1px solid var(--border); border-radius: 8px; padding: 10px; overflow: auto; max-height: 420px; font-size: 12px; margin: 8px 0 0; }
.error { background: var(--bad-bg); color: var(--text); border-radius: 8px; padding: 12px 14px; }
.error b { color: var(--bad); display: block; }
</style>
</head>
<body>
<div class="topbar"><div class="in">
  <h1>Rà soát hồ sơ vay · AI</h1>
  <label for="case-select">Hồ sơ mẫu</label>
  <select id="case-select"></select>
  <span class="grow"></span>
  <span id="health" class="pill">đang kết nối…</span>
  <div class="key" id="key-box">
    <input id="key" type="password" autocomplete="off" placeholder="Mã truy cập (INTERNAL_API_KEY)" title="Lấy ở Render → fintech-ai-internal → Environment">
    <button id="key-save">Lưu</button>
  </div>
  <div class="key" id="key-ok" hidden><span class="pill p-ok">Đã nhập mã</span><button class="link small" id="key-change">Đổi</button></div>
</div></div>

<div class="wrap">
  <div id="test" class="test"></div>
  <section class="panel" id="case-head"></section>
  <div class="cols">
    <section class="panel">
      <h2>Tài liệu trong hồ sơ</h2>
      <div id="docs"></div>
      <div id="requests"></div>
    </section>
    <section class="panel">
      <h2>AI phát hiện</h2>
      <div id="findings"><div class="empty">Chưa rà soát. Bấm <b>Rà soát bằng AI</b> ở trên.</div></div>
      <details class="tech" style="margin-top:14px"><summary>Chi tiết kỹ thuật cho dev</summary>
        <p class="small muted" style="margin-top:8px">JSON gửi tới <code id="endpoint"></code> (sửa được; <code>snapshot_hash</code> được tính lại khi gửi):</p>
        <textarea id="payload" class="mono" rows="12" spellcheck="false"></textarea>
        <div id="raw"></div>
      </details>
    </section>
  </div>
</div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const store = {
  get(k) { try { return sessionStorage.getItem(k) || ""; } catch { return ""; } },
  set(k, v) { try { v ? sessionStorage.setItem(k, v) : sessionStorage.removeItem(k); } catch {} },
};
const money = (v) => v == null || v === "" ? "—" : Number(v).toLocaleString("vi-VN") + " ₫";
// "500000000" trong văn bản tự do -> "500.000.000"
const prettyText = (s) => esc(s).replace(/\b\d{6,}\b/g, (n) => Number(n).toLocaleString("vi-VN"));

const DOC = {
  loan_request: ["Đề nghị vay", "📝"], contract: ["Hợp đồng", "📄"], financial_statement: ["Báo cáo tài chính", "📊"],
  registration: ["Giấy đăng ký kinh doanh", "🏢"], acceptance_record: ["Biên bản nghiệm thu", "✅"],
  payment_record: ["Chứng từ thanh toán", "💸"],
};
const docName = (t) => DOC[t]?.[0] ?? t;
const REF_FIELD = { contract: "contract.ref", acceptance_record: "acceptance.ref", payment_record: "payment.ref" };
const FIELD = {
  "borrower.name": "Tên doanh nghiệp", "borrower.tax_id": "Mã số thuế", "loan.amount": "Số tiền đề nghị vay",
  "money.currency": "Đơn vị tiền", "receipt.amount": "Khoản phải thu", "receipt.contract_ref": "Thuộc hợp đồng",
  "receipt.scope_ref": "Phạm vi", "receipt.claim_type": "Trạng thái khoản thu", "receipt.expected_date": "Ngày dự kiến thu",
  "contract.ref": "Số hợp đồng", "contract.amount": "Giá trị hợp đồng", "contract.scope_ref": "Phạm vi",
  "contract.payment_condition": "Điều kiện thanh toán", "parties.borrower.tax_id": "MST bên cung cấp (người vay)",
  "parties.counterparty.tax_id": "MST bên mua", "parties.payee.tax_id": "MST bên nhận tiền", "parties.payer.tax_id": "MST bên trả tiền",
  "acceptance.ref": "Số biên bản", "acceptance.contract_ref": "Thuộc hợp đồng", "acceptance.date": "Ngày nghiệm thu",
  "acceptance.scope_ref": "Phạm vi", "acceptance.scope_text": "Nội dung nghiệm thu", "acceptance.amount": "Giá trị nghiệm thu",
  "payment.ref": "Số chứng từ", "payment.contract_ref": "Thuộc hợp đồng", "payment.date": "Ngày thanh toán",
  "payment.amount": "Số tiền", "payment.status": "Trạng thái giao dịch", "financial.period_end": "Kỳ báo cáo",
  "financial.scope": "Phạm vi báo cáo", "financial.unit_multiplier": "Đơn vị (x)", "financial.total_assets": "Tổng tài sản",
  "financial.liabilities": "Nợ phải trả", "financial.equity": "Vốn chủ sở hữu",
};
const MONEY_FIELDS = new Set(["loan.amount", "receipt.amount", "contract.amount", "acceptance.amount", "payment.amount"]);
const VALUE = { received: "Đã thu", expected: "Dự kiến thu", completed: "Hoàn tất", standalone: "Riêng lẻ" };
const RULES = {
  R01: "Đủ bộ giấy tờ", R02: "MST người vay khớp", R08: "Có biên bản nghiệm thu",
  R09: "Khoản \"đã thu\" có chứng từ", R10: "Tài liệu bổ sung đúng yêu cầu",
};
const RULE_STATUS = { pass: ["✓", "p-ok"], issue: ["✗", "p-bad"], unknown: ["?", "p-warn"], not_applicable: ["—", ""] };
const PROPOSAL = {
  still_open: ["Cần bổ sung", "bad", "p-bad"],
  candidate_resolved: ["Có thể đóng · chờ người duyệt", "ok", "p-ok"],
  unknown: ["Cần người duyệt xem", "warn", "p-warn"],
};
const CATEGORY = {
  missing_document: "Thiếu tài liệu", mismatched_document: "Tài liệu không khớp", insufficient_evidence: "Chưa đủ căn cứ",
  identity_mismatch: "Sai thông tin định danh", supported: "Có căn cứ",
};
const REASON = {
  MISSING_ACCEPTANCE: "Không có biên bản nghiệm thu", ACCEPTANCE_SUPPORTED: "Biên bản khớp hợp đồng và số tiền",
  PARTIAL_ACCEPTANCE: "Chỉ nghiệm thu một phần", SUPPLEMENT_CONTRACT_MISMATCH: "Tài liệu bổ sung thuộc hợp đồng khác",
  CONTRACT_MISMATCH: "Sai số hợp đồng", SCOPE_MISMATCH: "Sai phạm vi", PARTY_MISMATCH: "Sai bên ký", PAYEE_MISMATCH: "Sai bên nhận tiền",
  PAYMENT_SUPPORTED: "Chứng từ khớp", PARTIAL_PAYMENT: "Chứng từ chỉ cho một phần số tiền",
  MISSING_PAYMENT_RECORD: "Thiếu chứng từ thanh toán", RECEIVED_WITHOUT_PAYMENT_RECORD: "Khai đã thu nhưng không có chứng từ",
  PAYMENT_STATUS_NOT_COMPLETED: "Giao dịch chưa hoàn tất", UNSUPPORTED_CURRENCY: "Không phải tiền VND",
  CURRENCY_UNCLEAR: "Không rõ đơn vị tiền", AMOUNT_UNCLEAR: "Không rõ số tiền", AMOUNT_EXCEEDS_CONTRACT: "Vượt giá trị hợp đồng",
  AMOUNT_EXCEEDS_CLAIM: "Vượt khoản khai", ACCEPTANCE_DATE_UNCLEAR: "Không rõ ngày nghiệm thu",
  PAYMENT_CONDITION_UNCLEAR: "Điều kiện thanh toán chưa rõ", REVIEW_REQUIRED: "Cần người duyệt",
  SEMANTIC_PROVIDER_UNAVAILABLE: "Không gọi được Gemini", SUSPECTED_PROMPT_INJECTION: "Nghi có câu lệnh chèn vào AI",
  LLM_ASSISTED: "Gemini hỗ trợ đọc điều khoản", LLM_SUGGESTION: "Gemini gợi ý điều khoản (chờ người duyệt)",
  LLM_SUGGESTION_UNVERIFIED: "Gợi ý của Gemini chưa được xác thực", SOURCE_OCR_UNVERIFIED: "Nguồn chỉ có từ OCR",
  SOURCE_REJECTED_BY_EXTRACTION: "Bước trích xuất đã từ chối điều khoản", SOURCE_UNCERTAIN: "Nguồn chưa chắc chắn", LLM_OUTPUT_REJECTED: "Kết quả Gemini bị chặn", LLM_CONFLICT: "Gemini mâu thuẫn dữ liệu",
  BORROWER_TAX_ID_MISMATCH: "MST người vay không khớp", TAX_ID_UNREADABLE: "Không đọc được MST",
  AWAITING_RESPONSE: "Đang chờ doanh nghiệp bổ sung", DOCUMENT_PROVIDED: "Doanh nghiệp đã nộp tài liệu",
  CONTRACT_NOT_FOUND: "Không tìm thấy hợp đồng", OTHER_CONDITIONS_UNRESOLVED: "Còn điều kiện khác chưa rõ",
  UNREADABLE_SOURCE: "Không đọc được tài liệu nguồn",
};
const reason = (c) => REASON[c] ?? c;

let presets = [], current = null, lastInput = null;

// ---- kết nối + mã truy cập ----
fetch("/healthz").then((r) => r.json()).then((h) => {
  $("health").textContent = h.mode === "live" ? "AI đang chạy" : "Chế độ mock";
  $("health").className = "pill " + (h.mode === "live" ? "p-ok" : "p-warn");
}).catch(() => { $("health").textContent = "Mất kết nối"; $("health").className = "pill p-bad"; });

function showKey(editing) {
  const has = !!store.get("ai-key");
  $("key-box").hidden = has && !editing;
  $("key-ok").hidden = !has || editing;
}
$("key").value = store.get("ai-key");
$("key-save").addEventListener("click", () => { store.set("ai-key", $("key").value.trim()); $("key-box").classList.remove("need"); showKey(false); });
$("key").addEventListener("keydown", (e) => { if (e.key === "Enter") $("key-save").click(); });
$("key-change").addEventListener("click", () => { showKey(true); $("key").focus(); });
showKey(false);

// ---- hồ sơ mẫu ----
fetch("/console/presets.json").then((r) => r.json()).then((list) => {
  presets = list;
  const groups = {};
  list.forEach((p, i) => (groups[p.group] ??= []).push(i));
  $("case-select").innerHTML = Object.entries(groups).map(([g, idx]) =>
    `<optgroup label="${esc(g)}">${idx.map((i) => `<option value="${i}">${esc(list[i].title)}</option>`).join("")}</optgroup>`).join("");
  $("case-select").addEventListener("change", () => select(+$("case-select").value));
  select(0);
}).catch(() => { $("case-head").innerHTML = '<div class="empty">Không tải được hồ sơ mẫu.</div>'; });

const fieldsOf = (d) => Object.fromEntries((d.extraction?.fields ?? []).map((f) => [f.field_key, f.value]));
const docsOf = (input) => input?.snapshot?.documents ?? [];
function clauseField(input) {
  const d = docsOf(input).find((x) => x.document.type === "contract");
  const f = d?.extraction?.fields?.find((x) => x.field_key === "contract.payment_condition");
  return f && f.value === null ? f : null;
}

function select(i) {
  current = presets[i];
  $("case-select").value = String(i);
  $("payload").value = JSON.stringify(current.input, null, 2);
  $("endpoint").textContent = `POST /internal/v1/${current.operation}`;
  $("raw").innerHTML = "";
  renderTest(null);
  renderCase(current.input);
  $("findings").innerHTML = current.operation === "evaluate"
    ? '<div class="empty">Chưa rà soát. Bấm <b>Rà soát bằng AI</b> ở trên.</div>'
    : '<div class="empty">Đây là ca test route đọc PDF, không có hồ sơ để hiển thị. Bấm <b>Gọi thử</b> ở trên.</div>';
}

function renderTest(result) {
  const t = $("test");
  t.className = "test" + (result ? (result.ok ? " pass" : " fail") : "");
  t.innerHTML = `<span class="tag">Tình huống test</span><span>${esc(current.scenario)}</span>
    <span><b>Kỳ vọng:</b> ${esc(current.expect)}</span>
    ${result ? `<span class="verdict">${result.ok ? "✓ Đúng kỳ vọng" : "✗ Khác kỳ vọng"}</span>
      ${result.note ? `<span style="flex-basis:100%">${result.note}</span>` : ""}` : ""}`;
}

function renderCase(input) {
  const docs = docsOf(input);
  const loan = fieldsOf(docs.find((d) => d.document.type === "loan_request") ?? {});
  const c = input.snapshot?.case;
  const isEval = current.operation === "evaluate";
  $("case-head").innerHTML = `<div class="case-head">
    <div><div class="muted small">Hồ sơ vay</div><div class="who">${esc(c?.borrower_name ?? current.title)}</div></div>
    ${c ? `<div class="facts">
      <div class="fact"><span>Mã số thuế</span><b>${esc(c.borrower_tax_id)}</b></div>
      <div class="fact"><span>Đề nghị vay</span><b>${money(loan["loan.amount"])}</b></div>
      <div class="fact"><span>Khoản phải thu dùng làm căn cứ</span><b>${money(loan["receipt.amount"])}</b>
        <span>${esc(loan["receipt.contract_ref"] ?? "")}/${esc(loan["receipt.scope_ref"] ?? "")} · ${esc(VALUE[loan["receipt.claim_type"]] ?? loan["receipt.claim_type"] ?? "")}</span></div>
    </div>` : ""}
    <span class="grow"></span>
    <button class="primary" id="run">${isEval ? "Rà soát bằng AI" : "Gọi thử"}</button>
  </div>`;
  $("run").addEventListener("click", run);

  const clause = clauseField(input);
  $("docs").innerHTML = docs.map((d) => {
    const t = d.document.type, f = fieldsOf(d), ref = f[REF_FIELD[t]];
    const rows = (d.extraction?.fields ?? []).map((x) => {
      let v = x.value;
      if (x.field_key === "contract.payment_condition" && v === null) {
        return `<tr data-field="${esc(x.id)}"><td>${esc(FIELD[x.field_key])}<br><span class="pill p-warn">gửi Gemini đọc</span></td>
          <td><textarea id="clause" rows="4">${esc(x.raw_value)}</textarea><span class="small muted">Sửa thử câu chữ rồi bấm Rà soát.</span></td></tr>`;
      }
      if (v && typeof v === "object") v = x.raw_value ?? JSON.stringify(v);
      else if (MONEY_FIELDS.has(x.field_key)) v = money(v);
      else v = VALUE[v] ?? v;
      return `<tr data-ev="${esc(x.evidence_ids.join(" "))}"><td>${esc(FIELD[x.field_key] ?? x.field_key)}</td><td>${esc(v ?? "— (không đọc được)")}</td></tr>`;
    }).join("");
    return `<details class="doc" data-doc="${esc(d.document.id)}" ${clause && t === "contract" ? "open" : ""}>
      <summary><span class="ico">${DOC[t]?.[1] ?? "📄"}</span>
        <span><span class="name">${esc(docName(t))}${ref ? " " + esc(ref) : ""}</span>
          ${d.document.response_request_id ? ' <span class="pill p-info">nộp bổ sung</span>' : ""}<br>
          <span class="file">${esc(d.document.filename)}</span></span></summary>
      <div class="body"><table class="fields">${rows}</table></div></details>`;
  }).join("") || '<p class="muted small">Không có.</p>';
  $("clause")?.addEventListener("input", syncClause);

  const reqs = input.snapshot?.requests ?? [];
  $("requests").innerHTML = reqs.length ? `<h2 style="margin-top:16px">Yêu cầu bổ sung đã gửi trước đó</h2>` + reqs.map((r) =>
    `<div class="req"><span class="pill p-info">${esc(r.status === "approved" ? "Đã gửi" : r.status)}</span>
      ${esc(docName(r.required_type))} ${esc(r.contract_ref)}/${esc(r.required_scope)}<br>"${prettyText(r.content)}"</div>`).join("") : "";
}

function syncClause() {
  try {
    const data = JSON.parse($("payload").value);
    const f = clauseField(data);
    if (f) { f.raw_value = $("clause").value; $("payload").value = JSON.stringify(data, null, 2); }
  } catch {}
}

// Quy ước backend: sha256 của snapshot với sort keys, UTF-8, JSON compact.
function canonical(v) {
  if (Array.isArray(v)) return "[" + v.map(canonical).join(",") + "]";
  if (v && typeof v === "object") return "{" + Object.keys(v).sort().map((k) => JSON.stringify(k) + ":" + canonical(v[k])).join(",") + "}";
  return JSON.stringify(v);
}
async function sha256(text) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
  return [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, "0")).join("");
}

// ---- chạy ----
async function run() {
  const key = store.get("ai-key");
  if (!key) { showKey(true); $("key-box").classList.add("need"); $("key").focus(); return; }
  let data;
  try { data = JSON.parse($("payload").value); }
  catch (e) { return showError("JSON trong phần kỹ thuật bị lỗi cú pháp", e.message); }
  const op = current.operation;
  if (op === "evaluate" && data.snapshot && crypto.subtle) data.snapshot_hash = await sha256(canonical(data.snapshot));
  lastInput = data;
  $("run").disabled = true;
  $("findings").innerHTML = '<div class="empty"><span class="spinner"></span>AI đang rà soát… Lần đầu sau khi service ngủ có thể mất 30–60 giây.</div>';
  const t0 = performance.now();
  try {
    const res = await fetch(`/internal/v1/${op}`, {
      method: "POST", headers: { "Content-Type": "application/json", "X-Internal-Key": key }, body: JSON.stringify(data),
    });
    const body = await res.json().catch(() => null);
    $("raw").innerHTML = `<p class="small muted" style="margin-top:10px">Response HTTP ${res.status} · ${Math.round(performance.now() - t0)} ms · X-AI-Mode: ${esc(res.headers.get("X-AI-Mode") ?? "—")}</p><pre>${esc(JSON.stringify(body, null, 2))}</pre>`;
    if (op !== "evaluate") renderPdfRoute(res.status, body);
    else if (!res.ok || !body) renderHttpError(res.status, body);
    else renderFindings(body);
  } catch (e) {
    showError("Không gọi được service", e.message);
  } finally {
    $("run").disabled = false;
  }
}

function showError(title, text) {
  $("findings").innerHTML = `<div class="error"><b>${esc(title)}</b>${esc(text)}</div>`;
}

function renderPdfRoute(status, body) {
  const ok = status === 503;
  renderTest({ ok, note: ok ? "" : `Nhận HTTP ${status}.` });
  $("findings").innerHTML = ok
    ? `<div class="empty">Service báo phần đọc PDF chưa sẵn sàng (503), đúng như dự kiến.</div>`
    : `<div class="empty">Service trả HTTP ${status}. Xem chi tiết kỹ thuật bên dưới.</div>`;
}

function renderHttpError(status, body) {
  const err = body?.error;
  const msg = {
    FORBIDDEN: ["Mã truy cập sai", "Kiểm tra INTERNAL_API_KEY ở Render → Environment rồi bấm \"Đổi\" ở góc trên."],
    INVALID_REQUEST: ["Dữ liệu gửi đi sai định dạng", "Có thể do sửa JSON trong phần kỹ thuật. Chọn lại hồ sơ mẫu để khôi phục."],
    INVALID_MODEL_OUTPUT: ["Kết quả AI bị chặn vì không qua kiểm tra", "Service không trả kết quả sai. Đây là lỗi cần sửa trong rule hoặc guard."],
  }[err?.code] ?? [`Lỗi HTTP ${status}`, err?.message ?? "Xem log trên Render."];
  if (err?.code === "FORBIDDEN") { showKey(true); $("key-box").classList.add("need"); }
  const details = (err?.details ?? []).map((d) => `<li><code>${esc(d.path)}</code> ${esc(d.message)}</li>`).join("");
  $("findings").innerHTML = `<div class="error"><b>${esc(msg[0])}</b>${esc(msg[1])}${details ? `<ul class="small">${details}</ul>` : ""}</div>`;
}

function evidenceDocs(ids) {
  // gom evidence theo tài liệu, giữ thứ tự xuất hiện
  const byDoc = new Map();
  for (const d of docsOf(lastInput)) for (const e of d.extraction?.evidence ?? []) {
    if (ids.includes(e.id)) {
      if (!byDoc.has(d.document.id)) byDoc.set(d.document.id, { d, pages: new Set(), ids: [] });
      byDoc.get(d.document.id).pages.add(e.page);
      byDoc.get(d.document.id).ids.push(e.id);
    }
  }
  // tài liệu bổ sung/biên bản/chứng từ quyết định kết luận hơn hợp đồng hay đề nghị vay: đưa lên trước
  const rank = { acceptance_record: 0, payment_record: 0, contract: 1, loan_request: 2 };
  return [...byDoc.values()].sort((a, b) => (rank[a.d.document.type] ?? 3) - (rank[b.d.document.type] ?? 3));
}

function renderFindings(out) {
  const check = checkExpectations(out);
  const edited = $("clause") && clauseField(current.input)?.raw_value !== $("clause").value;
  if (edited) renderTest(null), $("test").insertAdjacentHTML("beforeend", '<span class="verdict">Đã sửa điều khoản: tự đánh giá</span>');
  else if (check) renderTest(check);

  // tài liệu bắt buộc mà AI xác nhận là không có: thêm ô trống màu đỏ bên trái
  document.querySelectorAll(".doc.missing").forEach((x) => x.remove());
  for (const a of out.assessments) if (a.absence_basis) {
    $("docs").insertAdjacentHTML("beforeend", `<div class="doc missing"><div style="padding:9px 12px;display:flex;gap:10px;align-items:center">
      <span class="ico">!</span><span><span class="name">${esc(docName(a.absence_basis.required_type))}</span><br>
      <span class="file">Không có trong hồ sơ · AI đã tìm trong ${a.absence_basis.searched_document_ids.length} tài liệu</span></span></div></div>`);
  }

  const sugg = Object.fromEntries((out.request_suggestions ?? []).map((s) => [s.issue_id, s]));
  let html = out.assessments.length ? "" : '<div class="empty">AI không phát hiện vấn đề nào.</div>';
  for (const a of out.assessments) {
    const [label, tone, pill] = PROPOSAL[a.proposal] ?? [a.proposal, "", ""];
    const money2 = a.supported_amount != null || a.unsupported_amount != null;
    const src = evidenceDocs(a.evidence_ids);
    const s = sugg[a.issue_id];
    html += `<div class="issue ${tone}">
      <div class="top"><div class="headline">${prettyText(a.summary)}</div><span class="pill ${pill}">${esc(label)}</span></div>
      <div class="sub">${esc(CATEGORY[a.category] ?? a.category)} · mức độ ${a.severity === "high" ? "cao" : "trung bình"} · quy tắc ${esc(a.rule_ids.join(", "))}</div>
      ${money2 ? `<div class="amounts"><div><span>Có căn cứ</span><b>${money(a.supported_amount)}</b></div>
        <div><span>Chưa có căn cứ</span><b>${money(a.unsupported_amount)}</b></div></div>` : ""}
      ${a.computed_date ? `<div class="amounts"><div><span>Hạn thanh toán AI tính được</span><b>${esc(a.computed_date)}</b></div></div>` : ""}
      <div class="why">${a.reason_codes.map((c) => `<span class="pill" title="${esc(c)}">${esc(reason(c))}</span>`).join("")}</div>
      ${src.length ? `<div class="src"><span class="muted">Căn cứ (bấm để xem bên trái):</span><br>${src.map((x) => {
        const f = fieldsOf(x.d), ref = f[REF_FIELD[x.d.document.type]];
        return `<button data-doc="${esc(x.d.document.id)}" data-ev="${esc(x.ids.join(" "))}">${esc(docName(x.d.document.type))}${ref ? " " + esc(ref) : ""} · tr.${[...x.pages].join(", ")}</button>`;
      }).join("")}</div>` : ""}
      ${s ? `<div class="ask"><b>AI đề xuất gửi doanh nghiệp (người duyệt quyết định có gửi không)</b>"${prettyText(s.content)}"</div>` : ""}
    </div>`;
  }
  html += `<h2 style="margin-top:18px">Kiểm tra theo quy tắc</h2><div class="rules">` + out.rule_results.map((r) => {
    const [sym, pill] = RULE_STATUS[r.status] ?? [r.status, ""];
    return `<span class="rule" title="${esc(r.reason_codes.map(reason).join(", "))}"><span class="pill ${pill}">${sym}</span>${esc(RULES[r.rule_id] ?? r.rule_id)}</span>`;
  }).join("") + `</div>`;
  const notes = (out.diagnostics ?? []).filter((d) => d.code !== "LLM_ASSISTED" || true);
  if (notes.length) html += `<h2 style="margin-top:18px">Ghi chú hệ thống</h2><ul class="small" style="margin:0;padding-left:18px">` +
    notes.map((d) => `<li><b>${esc(reason(d.code))}</b>: ${esc(d.message)}</li>`).join("") + `</ul>`;
  $("findings").innerHTML = html;
  $("findings").querySelectorAll(".src button").forEach((b) => b.addEventListener("click", () => highlight(b.dataset.doc, b.dataset.ev.split(" "))));
}

function highlight(docId, evIds) {
  document.querySelectorAll(".doc.flash").forEach((x) => x.classList.remove("flash"));
  document.querySelectorAll(".fields tr.hl").forEach((x) => x.classList.remove("hl"));
  const el = document.querySelector(`.doc[data-doc="${CSS.escape(docId)}"]`);
  if (!el) return;
  el.open = true;
  el.classList.add("flash");
  el.querySelectorAll("tr[data-ev]").forEach((tr) => { if (tr.dataset.ev.split(" ").some((id) => evIds.includes(id))) tr.classList.add("hl"); });
  el.scrollIntoView({ behavior: "smooth", block: "center" });
}

function checkExpectations(out) {
  const noGemini = out.diagnostics?.some((d) => d.code === "SEMANTIC_PROVIDER_UNAVAILABLE");
  const hint = noGemini ? "Service không gọi được Gemini: kiểm tra GEMINI_API_KEY ở Render → Environment." : "";
  if (current.expected && current.input.run_id === out.run_id) {
    const diffs = compare(current.expected, out);
    return { ok: !diffs.length, note: diffs.length
      ? `${diffs.length} điểm khác đáp án chuẩn: <code>${esc(diffs.slice(0, 3).join(" · "))}</code>${diffs.length > 3 ? " …" : ""} ${esc(hint)}` : "" };
  }
  const exp = current.expected_proposals;
  if (!exp) return null;
  const bad = Object.entries(exp).map(([rule, want]) => {
    const a = out.assessments.find((x) => x.issue_key.startsWith(rule + ":"));
    return { rule, want, got: a?.proposal };
  }).filter((l) => l.got !== l.want);
  return { ok: !bad.length, note: bad.length ? esc(bad.map((l) =>
    `${l.rule}: kỳ vọng "${PROPOSAL[l.want]?.[0] ?? l.want}", AI ra "${PROPOSAL[l.got]?.[0] ?? l.got ?? "không có"}".`).join(" ") + " " + hint) : "" };
}

// Bản JS của evaluation/compare.py: so chặt trường quyết định, evidence so như tập hợp.
const RULE_FIELDS = ["status", "reason_codes", "issue_keys"];
const ASSESSMENT_FIELDS = ["issue_id", "rule_ids", "category", "severity", "proposal", "reason_codes",
  "supported_amount", "unsupported_amount", "computed_date"];
const SUGGESTION_FIELDS = ["required_type", "contract_ref", "required_scope"];
const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
const sameSet = (a, b) => same([...(a ?? [])].sort(), [...(b ?? [])].sort());
const absence = (b) => b ? [b.checklist_version, b.required_type, [...b.searched_document_ids].sort()] : null;

function compare(expected, actual) {
  const diffs = [];
  for (const k of ["run_id", "case_id", "case_revision", "snapshot_hash", "status"]) {
    if (!same(expected[k], actual[k])) diffs.push(`${k}: expected ${JSON.stringify(expected[k])}, got ${JSON.stringify(actual[k])}`);
  }
  const byKey = (list, k) => Object.fromEntries((list ?? []).map((x) => [x[k], x]));
  const section = (label, exp, act, fields, extra) => {
    for (const k of [...new Set([...Object.keys(exp), ...Object.keys(act)])].sort()) {
      const e = exp[k], a = act[k];
      if (!e || !a) { diffs.push(`${label} ${k}: only in ${e ? "expected" : "actual"}`); continue; }
      for (const f of fields) if (!same(e[f], a[f])) diffs.push(`${label} ${k}.${f}: expected ${JSON.stringify(e[f])}, got ${JSON.stringify(a[f])}`);
      if (!sameSet(e.evidence_ids, a.evidence_ids)) diffs.push(`${label} ${k}.evidence_ids: set differs`);
      extra?.(k, e, a);
    }
  };
  section("rule", byKey(expected.rule_results, "rule_id"), byKey(actual.rule_results, "rule_id"), RULE_FIELDS);
  section("assessment", byKey(expected.assessments, "issue_key"), byKey(actual.assessments, "issue_key"), ASSESSMENT_FIELDS,
    (k, e, a) => { if (!same(absence(e.absence_basis), absence(a.absence_basis))) diffs.push(`assessment ${k}.absence_basis differs`); });
  section("suggestion", byKey(expected.request_suggestions, "issue_id"), byKey(actual.request_suggestions, "issue_id"), SUGGESTION_FIELDS);
  return diffs;
}
